# =============================================================================
#  APARTMENT LAYOUT - SINGLE SOURCE OF TRUTH
#  Vienna Parkside Residence, type C3 (apartments 129/145/161/177), 3 rooms.
#
#  Every 3D object in models/apartment.blend is GENERATED from this file.
#  Edit here, then:  uv run apartment validate  &&  uv run apartment build
#
#  COORDINATES (metres, plan view, = Blender world X/Y):
#    origin  = outer corner of facade B and the bottom neighbour wall
#    +X      = along facade A (towards bedroom 1)
#    +Y      = towards facade A
#    Z = 0   = finished floor level
#  Facade A (+Y side) faces WNW, facade B (-X side) faces SSW - see [site].
#
#  Provenance of every number: docs/decisions/0001-layout-reconstruction.md
#  Status: "estimated" = derived from developer render + listed areas,
#          "confirmed" = confirmed by the owner, "measured" = measured on site.
# =============================================================================

[project]
name = "Vienna Parkside C3 - apartment 161"
listed_usable_area = 85.99        # "Suprafata utila"
listed_total_area = 92.75         # incl. balcony ("Suprafata utila totala")
area_tolerance = 0.03             # validator: room area must be within 3 % of listing

[site]
city = "Bucharest, Sector 4 (Metalurgiei Park)"
latitude = 44.365                 # approx. project location
longitude = 26.124
utc_offset_standard = 2.0         # EET; EU summer time (+1 h) is applied automatically
# Compass bearing (deg, clockwise from true north) that the +Y axis points to.
# Facade A's outward normal is +Y and faces WNW ~294 deg (owner confirmed 2026-10-04).
plus_y_bearing = 294.0

[levels]
ceiling_height = 2.70             # clear height, finished floor -> ceiling (owner confirmed)
slab_thickness = 0.25             # structural slab + screed above / below
balcony_floor_z = -0.03
balcony_above = true              # floor above has the same balcony (shades the living room)

[wall_types]
exterior  = { thickness = 0.45,  note = "30 cm AAC + 15 cm EPS (owner confirmed)" }
party     = { thickness = 0.25,  note = "double partition to neighbour (owner confirmed)" }
corridor  = { thickness = 0.25,  note = "wall to common corridor - assumed same as party" }
partition = { thickness = 0.125, note = "interior partition (owner confirmed)" }

[openings_defaults]
window_sill = 0.90                # owner chose 'standard'
window_head = 2.40
door_head = 2.10
frame_depth = 0.08
frame_width = 0.06
# Window frames sit at the AAC/EPS boundary, measured from the OUTER wall face.
window_setback_from_outside = 0.15

