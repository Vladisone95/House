# Furniture variant A - generated by `apartment variant`, then edited by hand / by Claude.
# Schema and conventions: docs/decisions/0005-furniture-variants.md
#   id        = "<VARIANT>.<type>-<room-slug>-<n>"  (unique across all variants)
#   size      = [width, depth, height] m      position = [x, y] centre of footprint (model metres)
#   rotation  = degrees CCW, 0 = front faces +Y (facade A), 90 = -X, 180 = -Y, 270 = +X
#   elevation = underside height (0 = on the floor)   color = "#rrggbb"   status = draft|approved
#
# Room ids -> slugs used in ids: living, kitchen, hall, balcony, bedroom_1 -> bedroom-1,
#   bath_1 -> bathroom-1, bedroom_2 -> master-suite, bath_2 -> master-bathroom
#
# Example piece (copy, uncomment, adjust):
# [[items]]
# id = "A.sofa-living-1"
# type = "sofa"
# room = "living"
# size = [2.20, 0.95, 0.85]
# position = [3.60, 7.30]
# color = "#7a7f86"
# status = "draft"

[variant]
key = "A"
name = "Variant A"
description = "Starting point - empty shell, furniture to be planned with the owner"
