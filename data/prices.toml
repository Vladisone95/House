# =============================================================================
#  PRICE CATALOGUE - what the owner pays ON TOP of the turnkey delivery (ADR 0011)
#
#  The apartment is delivered TURNKEY ("la cheie") by the developer: tiles, parquet, interior doors,
#  white paint, sanitary ware, electrics, plumbing, underfloor heating, boiler, 1 AC unit and 2 heat
#  recovery units are included ([turnkey] below, from the developer's finishing budget). The developer
#  gives a budget per item; choosing something nicer costs only the DIFFERENCE. So this list prices:
#    * upgrades over the developer's allowances (price - allowance, never below 0)
#    * extras the turnkey delivery does not have (furniture, kitchen, stretch ceilings, lighting...)
#  `uv run apartment prices --variant V1 --open`  or the "Price list" button in Blender
#  -> docs/prices/<VARIANT>.html  (quantities are measured from apartment.toml + the variant).
#
#  Every price = [low, mid, high] in RON, INCLUDING VAT (21 %). Bucharest market, autumn 2026:
#    low  = Dedeman / Hornbach / IKEA / Jysk ranges, melamine (PAL) carpentry
#    mid  = typical Bucharest workshop / contractor, painted MDF, mid brands (Bosch, Grohe, Egger...)
#    high = premium custom carpentry and brands (Villeroy & Boch, Miele, designer lighting)
#  Calibrated 2026-10-04 (owner: first prices looked low) against brig.ro 2026 price guides:
#  custom kitchen 1 500-2 800 / 2 800-4 000 / 5 000-10 000 lei per metre (bodies only).
#  status: "estimated" = Claude's market estimate (not a quote). When the owner gets a real quote,
#  put it in and set status = "quoted" on that entry (the page marks quoted lines).
#
#  Units of [items.*]:  pc = per piece | m = per metre of the piece's width |
#    m2 = per m2 of front (width x height) | m2_floor = per m2 of footprint (width x depth)
#  An item type is looked up whole, then without its leading words ("plush-corner-sofa" ->
#  "corner-sofa" -> "sofa"). Types with no entry are listed as "not priced" on the page.
# =============================================================================

[meta]
currency = "RON"
eur_rate = 5.36           # RON per EUR (owner 2026-10-04)
vat = 0.21                # already included in every price below
waste = 0.10              # extra floor / wall covering bought for cuts and breakage
contingency = 0.10        # reserve on the extra fit-out works (surprises, small extras)
as_of = "2026-10"
status = "estimated"

# -----------------------------------------------------------------------------
#  TURNKEY DELIVERY - the developer's finishing budget ("Buget de finisaje", Art. 1) + owner
#  2026-10-04 (1 AC, 2 ventilation units). Allowances in lei incl. VAT, status "confirmed".
# -----------------------------------------------------------------------------
[turnkey]
included = [
    "Plaster, skim coat and white washable paint on all walls and ceilings",
    "PVC windows with triple glazing, metal entrance door",
    "Underfloor heating, electric boiler",
    "Electrical installation with modular switches and sockets; all plumbing",
    "Floor tiles (kitchen, bathrooms, hall), wall tiles (bathrooms), parquet (living, bedrooms) with skirting + underlay",
    "Interior doors, bathroom sanitary ware, a towel-rail radiator in each bathroom",
    "1 AC unit (refrigerant line, condensate drain and power prepared in the living room)",
    "2 heat-recovery ventilation units on the exterior wall",
]
standard_tile_max = 0.60   # tiles 25x30 ... 60x60 are standard; bigger ones cost a laying surcharge
note = "Kitchen wall tiles (backsplash) are not part of the standard delivery."

# A room surface the developer finishes: we pay only (material - allowance) per m2; laying is included.
[[turnkey.surface]]
label = "floor tiles (gresie)"
surface = "floor"
rooms = ["kitchen", "bath_1", "bath_2", "hall"]
allowance = 110

[[turnkey.surface]]
label = "parquet"
surface = "floor"
rooms = ["living", "bedroom_1", "bedroom_2"]
allowance = 65    # developer budget 95 lei/m2, of which 30 lei accessories (skirting, underlay) - also included

[[turnkey.surface]]
label = "wall tiles (faianta)"
surface = "walls"
rooms = ["bath_1", "bath_2"]
allowance = 110

# Pieces the developer supplies: credit = min(price of the matching pieces, amount x pieces), per
# room listed (or once for the whole apartment when `rooms` is empty).
# Developer list "800 900 800 800 900 800 800 800 800 800" read in document order: door 800,
# 3-room bath: bathtub 900, WC 800, basin set 800; service bath: shower 800, WC 800, basin set 800.
[[turnkey.piece]]
label = "bathtub + mixer"
types = ["bathtub"]
rooms = ["bath_2"]
amount = 900

[[turnkey.piece]]
label = "shower tray + mixer"
types = ["walk-in-shower", "shower"]
rooms = ["bath_1"]
amount = 800

[[turnkey.piece]]
label = "WC + cistern"
types = ["toilet"]
rooms = ["bath_1", "bath_2"]
amount = 800

[[turnkey.piece]]
label = "washbasin + small cabinet + mixer"
types = ["vessel-sink", "double-sink", "sink", "vanity", "vanity-frame"]
rooms = ["bath_1", "bath_2"]
amount = 800

[[turnkey.piece]]
label = "1 AC unit, installed"
types = ["air-conditioner"]
amount = 2800      # estimated value of the included standard split unit
pieces = 1

[[turnkey.piece]]
label = "2 heat-recovery ventilation units"
types = ["heat-recovery-vent"]
amount = 1600      # estimated value of each included unit
pieces = 2

