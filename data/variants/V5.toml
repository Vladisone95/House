# Furniture variant V5 - generated by `apartment variant`, then edited by hand / by Claude.
# Schema and conventions: docs/decisions/0005-furniture-variants.md (+ 0006 storage, fixed points)
#   id        = "<VARIANT>.<type>-<room-slug>-<n>"  (unique across all variants)
#   size      = [width, depth, height] m      position = [x, y] centre of footprint (model metres)
#   rotation  = degrees CCW, 0 = front faces +Y (facade A), 90 = -X, 180 = -Y, 270 = +X
#   elevation = underside height (0 = on the floor)   color = "#rrggbb"   status = draft|approved
#   storage pieces: optional [items.storage] + [[items.storage.modules]] (fronts, interior)

[variant]
key = "V5"
name = "Modern Minimalism"
description = "V1's furniture and places restyled as Modern Minimalism - monochrome chalk whites, pale concrete large-format floors, grey-washed oak in bedrooms, handleless matte-white fronts, graphite wood, a charcoal wool sofa with chalk boucle armchairs, brushed steel + matte black, a single yellow accent in the kids' room"
based_on = "V1"
style_of = "V1"
wall_color = "#ebeae6"
true_colors = true

[rooms.bath_1]
floor = "minimal_graphite"
walls = "minimal_white_stone"
stretch_ceiling = true
stretch_led_color = "#ffc98f"
stretch_led_w_per_m = 7

[rooms.bath_2]
floor = "minimal_graphite"
walls = "minimal_concrete"
stretch_ceiling = true
stretch_led_color = "#ffc98f"
stretch_led_w_per_m = 7

[rooms.hall]
floor = "minimal_concrete"
stretch_ceiling = true
stretch_led_color = "#ffc98f"
stretch_led_w_per_m = 7
paint = "#e0dfdb"

[rooms.kitchen]
floor = "minimal_concrete"
paint = "#ecebe7"

[rooms.living]
floor = "minimal_concrete"
stretch_ceiling = true
stretch_led_color = "#ffc98f"
stretch_led_w_per_m = 7
skirting = "#e3e2de"
paint = "#e3e2de"

[rooms.bedroom_1]
floor = "minimal_grey_oak"
skirting = "#e6e8ea"
paint = "#e6e8ea"

[rooms.bedroom_2]
floor = "minimal_grey_oak"
skirting = "#c9c7c2"
paint = "#c9c7c2"

[rooms.balcony]
floor = "minimal_concrete"

