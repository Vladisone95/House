[project]
name = "apartment"
version = "0.1.0"
description = "Parametric Blender model + interior design workspace for a 3-room apartment (Vienna Parkside C3)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
]

[project.scripts]
apartment = "apartment_core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apartment_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"blender/apartment_tools/__init__.py" = ["E402"]  # bl_info must precede imports by convention
