# Furniture variant D2 - generated by `apartment variant`, then edited by hand / by Claude.
# Schema and conventions: docs/decisions/0005-furniture-variants.md (+ 0006 storage, fixed points)
#   id        = "<VARIANT>.<type>-<room-slug>-<n>"  (unique across all variants)
#   size      = [width, depth, height] m      position = [x, y] centre of footprint (model metres)
#   rotation  = degrees CCW, 0 = front faces +Y (facade A), 90 = -X, 180 = -Y, 270 = +X
#   elevation = underside height (0 = on the floor)   color = "#rrggbb"   status = draft|approved
#   storage pieces: optional [items.storage] + [[items.storage.modules]] (fronts, interior)

[variant]
key = "D2"
name = "Colour Drenched"
description = "Colour drenching / livable dopamine: every room wrapped in one saturated colour (walls, skirting, ceiling, joinery, textiles tone-on-tone) - ochre hall, teal living, olive kitchen, oxblood suite, rosewood bath, butter kids' room - tied together by honey oak, walnut, oxblood-fleck terrazzo and aged brass."
based_on = "V1"
wall_color = "#efe4d2"
true_colors = true

