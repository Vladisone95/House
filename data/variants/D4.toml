# Furniture variant D4 - generated by `apartment variant`, then edited by hand / by Claude.
# Schema and conventions: docs/decisions/0005-furniture-variants.md (+ 0006 storage, fixed points)
#   id        = "<VARIANT>.<type>-<room-slug>-<n>"  (unique across all variants)
#   size      = [width, depth, height] m      position = [x, y] centre of footprint (model metres)
#   rotation  = degrees CCW, 0 = front faces +Y (facade A), 90 = -X, 180 = -Y, 270 = +X
#   elevation = underside height (0 = on the floor)   color = "#rrggbb"   status = draft|approved
#   storage pieces: optional [items.storage] + [[items.storage.modules]] (fronts, interior)

[variant]
key = "D4"
name = "Teak & Saffron"
description = "Mid-century modern revival, 2025-26 take: low teak pieces on slim legs, an olive velvet sofa facing a long teak credenza, a cognac lounge-chair corner by the WNW window, cream terrazzo underfoot, teal and olive glazed baths, mustard and burnt-orange accents on warm cream walls."
based_on = "V1"
wall_color = "#efe8da"
true_colors = true

[finishes.d4_oak]
kind = "parquet"
size = [1.2, 0.19]
color = "#c9a274"
color2 = "#b48d61"
joint_color = "#6f5236"
joint = 0.002
direction = "x"
roughness = 0.45
note = "D4: natural oak planks, mid-light, so teak and walnut furniture read darker against them"

[finishes.d4_terrazzo]
kind = "tiles"
size = [0.6, 0.6]
color = "#ece3d2"
