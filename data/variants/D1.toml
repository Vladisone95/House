# Furniture variant D1 - generated by `apartment variant`, then edited by hand / by Claude.
# Schema and conventions: docs/decisions/0005-furniture-variants.md (+ 0006 storage, fixed points)
#   id        = "<VARIANT>.<type>-<room-slug>-<n>"  (unique across all variants)
#   size      = [width, depth, height] m      position = [x, y] centre of footprint (model metres)
#   rotation  = degrees CCW, 0 = front faces +Y (facade A), 90 = -X, 180 = -Y, 270 = +X
#   elevation = underside height (0 = on the floor)   color = "#rrggbb"   status = draft|approved
#   storage pieces: optional [items.storage] + [[items.storage.modules]] (fronts, interior)

[variant]
key = "D1"
name = "Dune Cocoon"
description = "Soft Curves / Cocooning Modern: rounded oat-boucle and rust-velvet seating, oval pedestal tables, pill (arch) mirrors and sculpted dune walls wrapped in cloud cream, clay-rose and mocha walnut, lit softly from coves and low lamps."
based_on = "V1"
wall_color = "#e6d3bd"
true_colors = true

[finishes.d1_warm_oak]
kind = "parquet"
size = [1.5, 0.22]
color = "#c49a6c"
color2 = "#b0865a"
joint_color = "#6e4b3a"
joint = 0.002
direction = "x"
roughness = 0.5
note = "warm natural oak, wide 22 cm planks (living, bedrooms)"

