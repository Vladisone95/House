# Furniture variant DEV - the real-estate developer's furnishing, recreated from their 3D render
# (docs/reference/developer_plan_C3.jpg = viennaparkside.ro/apartamente/c3-scb-161/).
# Schema and conventions: docs/decisions/0005-furniture-variants.md (+ 0006 storage, fixed points)
#   id        = "<VARIANT>.<type>-<room-slug>-<n>"  (unique across all variants)
#   size      = [width, depth, height] m      position = [x, y] centre of footprint (model metres)
#   rotation  = degrees CCW, 0 = front faces +Y (facade A), 90 = -X, 180 = -Y, 270 = +X
#   elevation = underside height (0 = on the floor)   color = "#rrggbb"   status = draft|approved
#   storage pieces: optional [items.storage] + [[items.storage.modules]] (fronts, interior);
#   modules are listed left -> right as seen standing in front of the piece.
# Colours sampled from the render. Positions/sizes read off the render and fitted to our walls;
# pieces the render does not show clearly carry a note (owner to confirm).

[variant]
key = "DEV"
name = "Real estate developer schema"
description = "The developer's furnishing from the sales render (1:1 as far as the image shows)"
wall_color = "#f1efeb"

