# Furniture variant D5 - generated by `apartment variant`, then edited by hand / by Claude.
# Schema and conventions: docs/decisions/0005-furniture-variants.md (+ 0006 storage, fixed points)
#   id        = "<VARIANT>.<type>-<room-slug>-<n>"  (unique across all variants)
#   size      = [width, depth, height] m      position = [x, y] centre of footprint (model metres)
#   rotation  = degrees CCW, 0 = front faces +Y (facade A), 90 = -X, 180 = -Y, 270 = +X
#   elevation = underside height (0 = on the floor)   color = "#rrggbb"   status = draft|approved
#   storage pieces: optional [items.storage] + [[items.storage.modules]] (fronts, interior)

[variant]
key = "D5"
name = "Jewel Box Deco"
description = "Neo Art Deco made livable: an ivory envelope with one jewel tone per room (emerald living + kitchen, sapphire suite, oxblood accents), black lacquer and polished brass, fluted walnut, bold-veined marble, brass-strip terrazzo and statement halo lights."
based_on = "V1"
wall_color = "#ece4d4"
true_colors = true

[finishes.d5_smoked_oak]
kind = "parquet"
size = [0.6, 0.1]
color = "#4a3324"
color2 = "#3a281b"
joint_color = "#1a110b"
joint = 0.002
direction = "x"
roughness = 0.35
note = "smoked oak short planks 60 x 10 - dark Deco floor (living, suite)"

[finishes.d5_brass_terrazzo]
kind = "tiles"
size = [0.6, 0.6]
