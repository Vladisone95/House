# Furniture variant D3 - generated by `apartment variant`, then edited by hand / by Claude.
# Schema and conventions: docs/decisions/0005-furniture-variants.md (+ 0006 storage, fixed points)
#   id        = "<VARIANT>.<type>-<room-slug>-<n>"  (unique across all variants)
#   size      = [width, depth, height] m      position = [x, y] centre of footprint (model metres)
#   rotation  = degrees CCW, 0 = front faces +Y (facade A), 90 = -X, 180 = -Y, 270 = +X
#   elevation = underside height (0 = on the floor)   color = "#rrggbb"   status = draft|approved
#   storage pieces: optional [items.storage] + [[items.storage.modules]] (fronts, interior)

[variant]
key = "D3"
name = "Biophilic Modern - Light & Leaf"
description = "Biophilic Modern: a light-led home where every room looks to daylight and a living plant - limewash clay-white walls, light oak, cane and travertine, sage and moss linens, a preserved-moss media wall, a plant-and-book wall, herbs in the kitchen, ferns in the baths and the balcony as a terracotta garden room."
based_on = "V1"
wall_color = "#ece5d8"
true_colors = true

[finishes.d3_oak]
kind = "parquet"
size = [1.8, 0.2]
color = "#cdab82"
color2 = "#bb966b"
joint_color = "#8a6a4a"
joint = 0.002
direction = "x"
roughness = 0.5
note = "light natural oak, wide 180 x 20 planks, matte oiled (living, both bedrooms)"

